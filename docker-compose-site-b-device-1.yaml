services:
  state_machine_service:
    build: ./src/state_machine/
    volumes:
      - ./deployment/config/config1-site-b.json:/app/config.json
      - ./deployment/log/state_machine:/app/logs
    restart: always
    network_mode: "host"

  
  valves_service:
    build: ./src/valves_node/
    privileged: true
    volumes:
      - ./deployment/config/config1-site-b.json:/app/config.json
      - ./deployment/logs/valve_controller:/app/logs

    restart: always

  serial_service:
    build: ./src/serial_service/
    volumes:
      - ./deployment/config/config1-site-b.json:/app/config.json
      - ./deployment/logs/serial_com:/app/logs

    devices:
      # /dev/ttyUSB0 is unstable — it's assigned by USB enumeration order and
      # shifts (e.g. to ttyUSB1) on any adapter disconnect/reconnect, which
      # caused a serial_service outage on the test node. Use the stable by-id
      # path instead once the new hardware's adapter is connected: run
      # `ls -la /dev/serial/by-id/` on the device and replace the line below
      # with e.g. /dev/serial/by-id/usb-<VENDOR>_<PRODUCT>_<SERIAL>-if00-port0:/dev/ttyACM0
      - /dev/serial/by-id/REPLACE_WITH_DEVICE_ID:/dev/ttyACM0
    restart: always


